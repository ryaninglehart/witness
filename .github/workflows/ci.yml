name: witness

# The gate runs on every push and every pull request. A check that only runs
# when someone remembers to run it is not a check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims this runs on a laptop with no special setup, so it
        # is tested across the versions a reviewer is plausibly holding rather
        # than only the one it was written on.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fetch PriMock57
        # Text only. The audio is git-lfs, roughly a gigabyte, and nothing in
        # the harness reads it -- grounding is measured against the human
        # transcripts the corpus ships.
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: git clone --depth 1 https://github.com/babylonhealth/primock57.git

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Gate
        # lint, tests, evidence, validation, calibration, sabotage, and the
        # held-out cross-validation that checks the published figures still
        # reproduce. Any one of them exiting non-zero fails the build.
        run: |
          start=$(date +%s)
          make check
          elapsed=$(( $(date +%s) - start ))
          echo "make check took ${elapsed}s"
          # The README tells a reviewer this is about a minute, which is the
          # reason anyone tries it; it runs in ~57s here. Budgeted at 5x to
          # absorb runner variance -- this catches the gate quietly becoming a
          # nightly job, not a slow afternoon on shared CI.
          if [ "$elapsed" -gt 300 ]; then
            echo "::error::make check took ${elapsed}s; the README claims about a minute"
            exit 1
          fi

      - name: Reproducible across processes
        # The in-process determinism tests cannot see a figure that drifts
        # between runs -- a hash seeded per process, a solver that picks a
        # different sign, a dict iteration order that leaks into a tie-break.
        # Running the whole evaluation twice and diffing is the only check
        # that covers those, and it costs a minute.
        run: |
          .venv/bin/python -m witness.cli crossval > /tmp/run1.txt
          .venv/bin/python -m witness.cli crossval > /tmp/run2.txt
          diff /tmp/run1.txt /tmp/run2.txt || {
            echo "::error::crossval is not reproducible between runs"
            exit 1
          }
          echo "identical across two processes"
        env:
          PYTHONPATH: src
