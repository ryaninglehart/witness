[project]
name = "witness"
version = "0.1.0"
description = "A faithfulness harness for ambient clinical documentation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
